apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: todo
  namespace: argocd
spec:
  description: Todo Summary Assistant Helm deployment
  sourceRepos:
    - https://github.com/Karthickcjx/TodoSummaryAssistant.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: todo
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ''
      kind: Service
    - group: ''
      kind: Secret
    - group: ''
      kind: PersistentVolumeClaim
    - group: networking.k8s.io
      kind: Ingress
