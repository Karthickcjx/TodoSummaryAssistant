apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-summary-assistant
  namespace: argocd
spec:
  project: todo
  source:
    repoURL: https://github.com/Karthickcjx/TodoSummaryAssistant.git
    targetRevision: todo-helm
    path: helm/todo-chart
    helm:
      releaseName: todo
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: todo
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
