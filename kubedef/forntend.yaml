apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: karthickcjx/todosummaryassistant-frontend:latest
        ports:
        - containerPort: 80
          name: frontend-port
        env:
          - name: REACT_APP_API_BASE_URL
            value: /api/todos
