services:
  # MySQL stores the todo items and keeps them in the named volume below.
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: todo_db
      MYSQL_ROOT_PASSWORD: Mysql123
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The backend connects to MySQL by its Compose service name: mysql.
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/todo_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Mysql123
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    depends_on:
      mysql:
        condition: service_healthy

  # Nginx serves the React build on http://localhost:3000.
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: /api/todos
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data:
