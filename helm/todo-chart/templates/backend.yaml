apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      {{- if .Values.dockerregistry.enabled }}
      imagePullSecrets:
        - name: todo-registry
      {{- end }}
      containers:
        - name: backend
          image: {{ printf "%s:%s" .Values.backend.image (required "backend.tag must not be empty" .Values.backend.tag) | quote }}
          ports:
            - name: backend-port
              containerPort: {{ .Values.backend.containerPort }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ printf "jdbc:mysql://mysql:%v/todo_db?createDatabaseIfNotExist=true" .Values.db.servicePort | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.db.defaultUser | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: db-pass
            - name: COHERE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: cohere
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: slack
