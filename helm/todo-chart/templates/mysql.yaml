apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: {{ .Values.db.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      {{- if .Values.dockerregistry.enabled }}
      imagePullSecrets:
        - name: todo-registry
      {{- end }}
      containers:
        - name: mysql
          image: {{ printf "%s:%s" .Values.db.image (required "db.tag must not be empty" .Values.db.tag) | quote }}
          ports:
            - name: mysql-port
              containerPort: {{ .Values.db.containerPort }}
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
          env:
            - name: MYSQL_DATABASE
              value: todo_db
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: db-pass
            {{- if ne .Values.db.defaultUser "root" }}
            - name: MYSQL_USER
              value: {{ .Values.db.defaultUser | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: db-pass
            {{- end }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-pvc
