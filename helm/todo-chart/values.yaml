backend:
  image: karthickcjx/todosummaryassistant-backend
  tag: latest
  replicas: 1
  containerPort: 8080
  servicePort: 8080

frontend:
  image: karthickcjx/todosummaryassistant-frontend
  tag: latest
  replicas: 1
  containerPort: 80
  servicePort: 80

db:
  image: mysql
  tag: latest
  replicas: 1
  containerPort: 3306
  servicePort: 3306
  storageClass: gp2
  storageSize: 5Gi
  defaultUser: root

secret:
  dbPassword: ""
  cohereApiKey: ""
  slackWebhookUrl: ""

ingress:
  enabled: true
  host: todo.kcthdevops.site
  servicePort: 80
  certificateArn: ""

dockerregistry:
  enabled: false
  server: ""
  username: ""
  password: ""
  email: ""
