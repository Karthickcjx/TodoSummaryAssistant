name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: todo-ecr-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  BACKEND_DIR: Backend/todo-summary-assistant
  FRONTEND_DIR: Frontend/todo
  BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY || 'todo-backendimg' }}
  FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY || 'todo-frontendimg' }}
  IMAGE_TAG: ${{ github.run_number }}
  HELM_BRANCH: ${{ vars.HELM_BRANCH || 'todo-helm' }}
  HELM_VALUES_FILE: ${{ vars.HELM_VALUES_FILE || 'helm/todo-chart/values.yaml' }}

jobs:
  package-backend:
    name: Package backend JAR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Backend/todo-summary-assistant/pom.xml
      - name: Package backend
        working-directory: ${{ env.BACKEND_DIR }}
        run: mvn -B -ntp clean package -DskipTests
      - name: Archive backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-${{ github.run_number }}-${{ github.run_attempt }}
          path: Backend/todo-summary-assistant/target/*.jar
          if-no-files-found: error

  test-backend:
    name: Backend tests and coverage
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: todo_ci
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci-only-password' }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Backend/todo-summary-assistant/pom.xml
      - name: Run tests and generate coverage
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/todo_ci?allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci-only-password' }}
        run: >-
          mvn -B -ntp
          org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent
          test
          org.jacoco:jacoco-maven-plugin:0.8.12:report
          dependency:copy-dependencies
      - name: Save backend analysis files
        uses: actions/upload-artifact@v4
        with:
          name: backend-analysis
          path: Backend/todo-summary-assistant/target/
          if-no-files-found: error

  test-frontend:
    name: Frontend tests and coverage
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/todo/package-lock.json
      - name: Run tests and generate coverage
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          CI: 'true'
        run: |
          npm ci
          npm test -- --watchAll=false --coverage --runInBand --passWithNoTests
          mkdir -p coverage
          if [ ! -f coverage/lcov.info ]; then
            echo '::warning::No frontend coverage report was generated; add frontend unit tests.'
          fi
          touch coverage/artifact-marker
      - name: Save frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/todo/coverage/
          if-no-files-found: error

  sonar-backend:
    name: Backend SonarQube quality gate
    needs: test-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: backend-analysis
          path: Backend/todo-summary-assistant/target
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dproject.settings=sonar-setup.properties
            -Dsonar.qualitygate.wait=true

  sonar-frontend:
    name: Frontend SonarQube quality gate
    needs: test-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/todo/coverage
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dproject.settings=sonar-frontend.properties
            -Dsonar.qualitygate.wait=true

  build-images:
    name: Build Docker images
    needs: [package-backend, sonar-backend, sonar-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build both images
        env:
          API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL || '/api/todos' }}
        run: |
          docker build -f Backend/Dockerfile -t todo-backend:build Backend
          docker build -f Frontend/Dockerfile \
            --build-arg "REACT_APP_API_BASE_URL=$API_BASE_URL" \
            -t todo-frontend:build Frontend
          docker save todo-backend:build todo-frontend:build | gzip > images.tar.gz
      - name: Save Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: images.tar.gz
          if-no-files-found: error
          retention-days: 1

  push-images:
    name: Push images to ECR
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      registry: ${{ steps.ecr.outputs.registry }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-images
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Load and push both images
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker load -i images.tar.gz
          for component in backend frontend; do
            if [ "$component" = backend ]; then
              repository="$BACKEND_REPOSITORY"
            else
              repository="$FRONTEND_REPOSITORY"
            fi
            for tag in "$IMAGE_TAG" latest; do
              docker tag "todo-$component:build" "$ECR_REGISTRY/$repository:$tag"
              docker push "$ECR_REGISTRY/$repository:$tag"
            done
          done

  update-helm:
    name: Update Helm values
    needs: push-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Fetch Helm branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HELM_BRANCH }}
          path: helm-release
          token: ${{ secrets.HELM_PUSH_TOKEN || github.token }}
      - name: Update and push Helm values
        working-directory: helm-release
        env:
          ECR_REGISTRY: ${{ needs.push-images.outputs.registry }}
        run: |
          python -m pip install --quiet 'ruamel.yaml==0.18.10'
          python - <<'PY'
          import os
          from pathlib import Path
          from ruamel.yaml import YAML
          path = Path(os.environ['HELM_VALUES_FILE'])
          yaml = YAML()
          values = yaml.load(path)
          for component in ('backend', 'frontend'):
              repository = os.environ[f'{component.upper()}_REPOSITORY']
              values[component]['image'] = f"{os.environ['ECR_REGISTRY']}/{repository}"
              values[component]['tag'] = os.environ['IMAGE_TAG']
          yaml.dump(values, path)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$HELM_VALUES_FILE"
          git diff --cached --quiet && exit 0
          git commit -m "chore(helm): deploy build $IMAGE_TAG"
          git push origin "HEAD:$HELM_BRANCH"
