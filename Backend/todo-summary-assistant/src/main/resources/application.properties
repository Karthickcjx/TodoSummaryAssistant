spring.application.name=todo-summary-assistant

# Load local configuration from .env when running from the backend project directory.
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/todo_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Cohere API Configuration
cohere.api.key=${COHERE_API_KEY:YOUR_COHERE_API_KEY}
cohere.api.model=${COHERE_MODEL:command-a-plus-05-2026}

# Slack Webhook Configuration
slack.webhook.url=${SLACK_WEBHOOK_URL:YOUR_WEBHOOK_URL}

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
spring.web.cors.allowed-headers=*
