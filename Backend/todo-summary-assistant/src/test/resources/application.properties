# Keep application context tests independent of a locally running MySQL server.
spring.datasource.url=jdbc:h2:mem:todo_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
cohere.api.key=test-key
slack.webhook.url=https://example.invalid/slack-webhook
